<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>art into code</title>
</head>
<body>
    <h1>convert your art into code!</h1>

    <div class="columns">
        <div class="tools">
            <span>tools</span>
        </div>
            
        <div class="preview">
            <span>paint here, this is your live preview:</span>
            <div id="grid"></div>
        </div>

        <div class="output1">
            <textarea id="output" readonly placeholder="generated CSS will show up here..."></textarea>
            <div class="row">
                <button id="copycss">copy</button>
                <span id="copyStatus"></span>
            </div>
        </div>
    </div>
        
    <canvas id="export" width="256" height="256"></canvas>
</body>
</html>
