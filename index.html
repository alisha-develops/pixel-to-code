<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>art into code</title>
</head>
<body>
    <h1>convert your art into code!</h1>

    <div class="columns">
        <div class="tools">
            <span>actions</span>
            <span class="toolbutton">grid size</span>
            <select id="selectsize">
                <option value="8">8 x 8</option>
                <option value="16" selected>16 x 16</option>
                <option value="32">32 x 32</option>
            </select>
            <span class="toolbutton">color</span>
            <canvas id="svcanvas" width="140" height="140"></canvas>
            <canvas id="huecanvas" width="140" height="16"></canvas>

            <div class="colorrow">
                <div id="currentcolor"></div>
                <input type="text" id="hexinput" placeholder="#fca1f9" maxlength="7">
            </div>
            <button id="clear">clear</button>
            <button id="generate">generate</button>
        </div>
            
        <div class="preview">
            <span>paint here, this is your live preview:</span>
            <div id="grid"></div>
        </div>

        <div class="output1">
            <textarea id="output" readonly placeholder="generated CSS will show up here..."></textarea>
            <div class="row">
                <button id="copycss">copy</button>
                <span id="copyStatus"></span>
            </div>
        </div>
    </div>
        
    <canvas id="export" width="256" height="256"></canvas>

    <script src="index.js"></script>
</body>
</html>
